name: CI

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Test dailyexchange
        run: ./gradlew :dailyexchange:test :dailyexchange:jacocoTestReport

      - name: Upload coverage dailyexchange
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: services/dailyexchange/build/reports/jacoco/test/jacocoTestReport.xml
          flags: dailyexchange